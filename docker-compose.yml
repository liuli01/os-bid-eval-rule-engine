version: '3.8'

services:
  rule-engine:
    build: .
    container_name: os-bid-eval-rule-engine
    ports:
      - "8080:8080"
    environment:
      - SERVER_PORT=8080
      - LOGGING_LEVEL_COM_CSCEC=INFO
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/rules/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
